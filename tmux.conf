# ---------------------------------------------------------------------------
# Portable tmux configuration
# ---------------------------------------------------------------------------

# Terminal capabilities and behaviour.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-256color:RGB'
set -as terminal-features ',tmux-256color:clipboard'
set -s set-clipboard external
set -g mouse on
set -g focus-events on
set -g history-limit 100000
set -g escape-time 10
set -g display-time 2500
set -g status-keys vi
setw -g mode-keys vi

# Copy tmux selections directly to the X11 desktop clipboard.
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '''xclip -selection clipboard -in'''
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '''xclip -selection clipboard -in'''
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel '''xclip -selection clipboard -in'''
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel '''xclip -selection clipboard -in'''
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '''xclip -selection clipboard -in'''

# Start window and pane numbering at 1 and keep window numbers compact.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Easier splits that keep the current pane's working directory.
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Prefix + N creates an outer window attached to a matching <name>-inner session.
bind N command-prompt -p 'Nested workspace name:' 'new-window -n "%%" "exec env TMUX= tmux new-session -A -E -s \"%%-inner\""'

# Reload this file with Prefix + r.
unbind r
bind r source-file ~/.tmux.conf \; display-message 'tmux configuration reloaded'

# Colour palette:
# background  #0f172a   surface #172033   muted  #64748b
# foreground  #dbeafe   blue    #38bdf8   violet #8b5cf6
# warning     #fbbf24
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style 'bg=#0f172a,fg=#94a3b8'
set -g status-left-length 40
set -g status-right-length 120

# Session badge.
set -g status-left '#[fg=#0f172a,bg=#38bdf8,bold] #S #[fg=#38bdf8,bg=#0f172a]│ '

# Windows: quiet inactive entries and a clear blue active tab.
setw -g window-status-separator ''
setw -g window-status-format '#[fg=#64748b,bg=#0f172a] #I:#W#{?window_flags, #F,} '
setw -g window-status-current-format '#[fg=#ffffff,bg=#2563eb,bold] #I:#W#{?window_zoomed_flag, Z,} #[fg=#2563eb,bg=#0f172a]│'
setw -g window-status-activity-style 'fg=#fbbf24,bg=#0f172a,bold'
setw -g window-status-bell-style 'fg=#ffffff,bg=#ef4444,bold'

# Right side: current directory, time and date.
set -g status-right '#[fg=#94a3b8] #{b:pane_current_path} #[fg=#334155]│#[fg=#cbd5e1] %H:%M #[fg=#334155]│#[fg=#64748b] %Y-%m-%d '

# Pane borders and compact pane titles.
set -g pane-border-status top
set -g pane-border-format '#[fg=#64748b] #{pane_index} #[fg=#94a3b8]#{pane_title} '
set -g pane-border-style 'fg=#334155'
set -g pane-active-border-style 'fg=#38bdf8'

# Messages, copy mode and clock.
set -g message-style 'fg=#dbeafe,bg=#1e293b,bold'
set -g message-command-style 'fg=#dbeafe,bg=#1e293b'
# Keep the copy-mode position visible against both the dark pane and the yellow selection highlight.
set -g cursor-style 'block'
set -g cursor-colour '#38bdf8'
setw -g mode-style 'fg=#0f172a,bg=#fbbf24,bold'
setw -g clock-mode-colour '#38bdf8'

# Persist tmux sessions, windows, panes, and layouts.
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'

# Restore any nested tmux attachment after resurrect has recreated all sessions.
# The wildcard keeps the saved target name, so future inner sessions need no
# additional configuration. TMUX= permits attachment from an outer tmux pane.
set -g @resurrect-processes '\
  "~tmux attach -E -t->TMUX= tmux attach -E -t *" \
  "~tmux attach-session -E -t->TMUX= tmux attach-session -E -t *" \
  "~tmux new-session -A -E -s->TMUX= tmux new-session -A -E -s *" \
'

# Load resurrect before continuum so continuum can use its save/restore scripts.
run-shell '$HOME/.tmux/plugins/tmux-resurrect/resurrect.tmux'
run-shell '$HOME/.tmux/plugins/tmux-continuum/continuum.tmux'
